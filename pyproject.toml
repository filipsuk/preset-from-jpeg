[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lr-optim-api"
version = "0.1.0"
description = "Python API layer for controlling Lightroom Classic via MIDI2LR and capturing Reference View screenshots"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
    "Pillow>=10.0.0",
    "pyobjc-framework-Quartz>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["lr_optim_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
